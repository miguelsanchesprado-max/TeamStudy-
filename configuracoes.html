<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>TeamStudy - Configurações</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <meta
    name="theme-color"
    content="#121212"
  >

  <link
    rel="stylesheet"
    href="assets/css/base.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/app.css"
  >

  <link
    rel="stylesheet"
    href="assets/css/configuracoes.css"
  >

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
  >

</head>


<body>

  <header>

    <h1>
      TeamStudy
    </h1>


    <nav
      class="desktop-nav"
      aria-label="Navegação principal"
    >

      <a href="dashboard.html">
        Dashboard
      </a>

      <a href="grupos.html">
        Meus Grupos
      </a>

      <a href="pendencias.html">
        Pendências
      </a>

      <a href="atividades-entregues.html">
        Entregas
      </a>

      <a href="perfil.html">
        Perfil
      </a>

      <a
        href="configuracoes.html"
        class="active"
      >
        Configurações
      </a>

    </nav>

  </header>


  <main class="container">

    <div class="card settings-card">

      <h2>
        Configurações do Sistema
      </h2>


      <div class="config-group">


        <!-- ==========================================
             APARÊNCIA
             ========================================== -->

        <div class="config-section">

          <div class="config-info">

            <label for="btnAlternarTema">
              Aparência
            </label>

            <small>
              Alterne entre o tema claro e escuro
            </small>

          </div>


          <button
            id="btnAlternarTema"
            class="btn btn-outline"
            type="button"
          >

            <span class="material-symbols-outlined">
              dark_mode
            </span>

            <span id="textoTema">
              Tema escuro
            </span>

          </button>

        </div>


        <hr class="divider">


        <!-- ==========================================
             SESSÃO
             ========================================== -->

        <div class="config-section danger-zone">

          <div class="config-info">

            <label>
              Sessão
            </label>

            <small>
              Desconectar da sua conta neste dispositivo
            </small>

          </div>


          <button
            id="btnSair"
            class="btn btn-danger"
            type="button"
          >

            <span class="material-symbols-outlined">
              logout
            </span>

            Sair da Conta

          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- ==========================================
       NAVEGAÇÃO MOBILE
       ========================================== -->

  <nav
    class="bottom-nav"
    aria-label="Navegação mobile"
  >

    <a href="dashboard.html">

      <span class="material-symbols-outlined">
        home
      </span>

      <span class="nav-label">
        Início
      </span>

    </a>


    <a href="pendencias.html">

      <span class="material-symbols-outlined">
        assignment
      </span>

      <span class="nav-label">
        Tarefas
      </span>

    </a>


    <a href="grupos.html">

      <span class="material-symbols-outlined">
        groups
      </span>

      <span class="nav-label">
        Grupos
      </span>

    </a>


    <a href="perfil.html">

      <span class="material-symbols-outlined">
        person
      </span>

      <span class="nav-label">
        Perfil
      </span>

    </a>


    <a
      href="configuracoes.html"
      class="active"
    >

      <span class="material-symbols-outlined">
        settings
      </span>

      <span class="nav-label">
        Ajustes
      </span>

    </a>

  </nav>


  <!-- ==========================================
       SUPABASE
       ========================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="assets/js/supabase.js"></script>


  <!-- ==========================================
       TEAMSTUDY
       ========================================== -->

  <script src="assets/js/configuracoes.js"></script>


  <!-- ==========================================
       SERVICE WORKER
       ========================================== -->

  <script>

    if ('serviceWorker' in navigator) {

      window.addEventListener(
        'load',
        () => {

          navigator.serviceWorker
            .register('./sw.js')
            .then(
              registration => {

                console.log(
                  'Service Worker registrado:',
                  registration
                );

              }
            )
            .catch(
              error => {

                console.error(
                  'Erro ao registrar Service Worker:',
                  error
                );

              }
            );

        }
      );

    }

  </script>


</body>

</html>
