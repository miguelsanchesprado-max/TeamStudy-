<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TeamStudy - Login</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/index.css">
</head>
<body class="page-auth">

  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-card">

        <div class="auth-header">
          <h1>TeamStudy</h1>
          <p>Acesse com o seu RA ou e-mail institucional</p>
        </div>

        <form id="formLogin" class="auth-form">
          <div class="form-group">
            <label for="loginIdentificacao">RA ou E-mail</label>
            <input
              type="text"
              id="loginIdentificacao"
              placeholder="Ex: 00001146955510sp@al.educacao.sp.gov.br"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label for="loginSenha">Senha</label>
            <input
              type="password"
              id="loginSenha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn btn-block">Entrar</button>
        </form>

        <div class="auth-footer">
          <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

      </div>
    </div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
