<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>TeamStudy — Login</title>

  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/index.css">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>TeamStudy</h1>
        <p>Estude em grupo, entregue no prazo.</p>
      </div>

      <form class="auth-form" id="loginForm">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="voce@escola.com" required>
        </div>
        <div class="form-group">
          <label for="senha">Senha</label>
          <input id="senha" type="password" placeholder="••••••••" required>
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>

      <div class="auth-footer">
        Novo por aqui? <a href="cadastro.html">Criar conta</a>
      </div>
    </div>

    <div class="marquee" aria-hidden="true">
      <div class="marquee-track">
        <span>Estude junto</span>
        <span>Entregue no prazo</span>
        <span>Suba de nível</span>
        <span>Estude junto</span>
        <span>Entregue no prazo</span>
        <span>Suba de nível</span>
      </div>
    </div>
  </div>

  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registrado com sucesso!', reg))
          .catch(err => console.error('Erro no SW:', err));
      });
    }
  </script>

</body>
</html>
