<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TeamStudy - Login</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <link rel="stylesheet" href="assets/css/index.css">
  
</head>
<body class="page-auth">

  <div class="auth-wrapper">
    <div class="auth-container">
      <div class="auth-card">

        <div class="auth-header">
          <h1>TeamStudy</h1>
          <p>Acesse com o seu RA ou e-mail institucional</p>
        </div>

        <form id="formLogin" class="auth-form">
          <div class="form-group">
            <label for="loginIdentificacao">RA ou E-mail</label>
            <input
              type="text"
              id="loginIdentificacao"
              placeholder="Ex: 00001146955510sp@al.educacao.sp.gov.br"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label for="loginSenha">Senha</label>
            <input
              type="password"
              id="loginSenha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            >
          </div>

          <button type="submit" class="btn btn-block">Entrar</button>
        </form>

        <div class="auth-footer">
          <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>

<script src="assets/js/storage.js"></script>
<script src="assets/js/auth.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => {
            console.log('Service Worker registrado:', registration);
          })
          .catch(error => {
            console.error('Erro ao registrar Service Worker:', error);
          });
      });
    }
    
  </script>
<div id="app-download-modal" class="app-modal-overlay">
  <div class="app-modal-card">
    <button id="modal-close" class="modal-close-btn">&times;</button>
    <div class="modal-icon">📱</div>
    <h2>Baixar o App TeamStudy?</h2>
    <p>Tenha uma experiência mais rápida, acesso direto da tela inicial e notificações de prazos.</p>

    <div class="modal-actions">
      <a href="baixar.html" class="btn-modal-primary">Baixar App</a>
      <button id="btn-dismiss-modal" class="btn-modal-secondary">Continuar na Web</button>
    </div>
  </div>
</div>

<style>
/* CSS do Modal Pop-up */
.app-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.7);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.app-modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.app-modal-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  background: #0f172a;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 20px;
  padding: 28px 24px;
  text-align: center;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  transform: translateY(20px);
  transition: transform 0.3s ease;
}

.app-modal-overlay.active .app-modal-card {
  transform: translateY(0);
}

.modal-close-btn {
  position: absolute;
  top: 12px;
  right: 16px;
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 1.5rem;
  cursor: pointer;
}

.modal-icon {
  font-size: 2.5rem;
  margin-bottom: 12px;
}

.app-modal-card h2 {
  color: #fff;
  font-size: 1.3rem;
  margin-bottom: 8px;
}

.app-modal-card p {
  color: #94a3b8;
  font-size: 0.9rem;
  line-height: 1.4;
  margin-bottom: 20px;
}

.modal-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.btn-modal-primary {
  background: var(--primary-color, #3b82f6);
  color: #fff;
  padding: 12px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: 600;
  font-size: 0.95rem;
  transition: background 0.2s;
}

.btn-modal-primary:hover {
  background: #2563eb;
}

.btn-modal-secondary {
  background: transparent;
  color: #94a3b8;
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.9rem;
}

.btn-modal-secondary:hover {
  color: #fff;
}
</style>

<script>
// Lógica para exibir o Pop-up
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('app-download-modal');
  const closeBtn = document.getElementById('modal-close');
  const dismissBtn = document.getElementById('btn-dismiss-modal');

  // Verifica se o usuário já fechou o pop-up anteriormente para não incomodar sempre
  const hasDismissed = localStorage.getItem('ts_download_dismissed');

  if (!hasDismissed) {
    // Exibe o modal após 1.5 segundos
    setTimeout(() => {
      modal.classList.add('active');
    }, 1500);
  }

  function closeModal() {
    modal.classList.remove('active');
    // Salva por 7 dias que o usuário já respondeu ao modal
    localStorage.setItem('ts_download_dismissed', 'true');
  }

  if (closeBtn) closeBtn.addEventListener('click', closeModal);
  if (dismissBtn) dismissBtn.addEventListener('click', closeModal);
  
});

</script>
</body>
</html>
